[project]
name = "aeoi-api"
version = "0.1.0"
description = "API gateway / BFF: authentication, coarse RBAC, rate limiting, routing to internal services"
requires-python = ">=3.12"
dependencies = [
    "aeoi-common",
    "aeoi-models",
    "aeoi-security",
    "aeoi-observability",
    "aeoi-web",
    "aeoi-db",
    "httpx>=0.27",
]

[project.scripts]
aeoi-devtoken = "aeoi_api.devtoken:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_api"]

[tool.uv.sources]
aeoi-common = { workspace = true }
aeoi-models = { workspace = true }
aeoi-security = { workspace = true }
aeoi-observability = { workspace = true }
aeoi-web = { workspace = true }
aeoi-db = { workspace = true }
