[project]
name = "aeoi-incident-service"
version = "0.1.0"
description = "System of record for incidents, timeline, evidence, approvals and feedback (owns schema `incident`)"
requires-python = ">=3.12"
dependencies = [
    "aeoi-common",
    "aeoi-models",
    "aeoi-security",
    "aeoi-observability",
    "aeoi-web",
    "aeoi-db",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiokafka>=0.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_incident"]

[tool.uv.sources]
aeoi-common = { workspace = true }
aeoi-models = { workspace = true }
aeoi-security = { workspace = true }
aeoi-observability = { workspace = true }
aeoi-web = { workspace = true }
aeoi-db = { workspace = true }
