[project]
name = "aeoi-agents"
version = "0.1.0"
description = "Stateless investigation agents (Phase 8: Log Analysis). Tools via tool-gateway, models via llm-gateway"
requires-python = ">=3.12"
dependencies = [
    "aeoi-common",
    "aeoi-models",
    "aeoi-security",
    "aeoi-observability",
    "aeoi-web",
    "aeoi-db",
    "aeoi-llm-client",
    "aeoi-tool-client",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_agents"]

[tool.uv.sources]
aeoi-common = { workspace = true }
aeoi-models = { workspace = true }
aeoi-security = { workspace = true }
aeoi-observability = { workspace = true }
aeoi-web = { workspace = true }
aeoi-db = { workspace = true }
aeoi-llm-client = { workspace = true }
aeoi-tool-client = { workspace = true }
