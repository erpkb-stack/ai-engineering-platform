# AEOI local stack. Use the smallest profile that does the job (Intel Mac RAM is the bottleneck).
#   make up                 -> infra   : postgres(pgvector)                    (redis: PROFILE=redis, unused until 22b)
#   make up PROFILE=kafka   -> + kafka (KRaft, 1 broker), then topic init job    (+~0.8 GB)
#   make keycloak-up        -> keycloak (OIDC IdP, Phase 17, ADR-027)            (+~0.6 GB)
#   make apps-up            -> postgres + every Python service + (apps-catalog) the Java
#                              catalog, from ONE image aeoi-py (Phase 21, ADR-033). Kafka only
#                              when .env turns the Kafka transport on; Keycloak via keycloak-up.
#   make obs-up             -> otel-collector + tempo + prometheus + loki + grafana (Phase 23a,
#                              ADR-035; ~0.3 GB idle, measured) - apps export when .env sets
#                              AEOI_OTEL_ENDPOINT
# Ports bind to 127.0.0.1 only: nothing is reachable from your LAN.
# Host ports are NON-default (5433/6380/9094) so they don't clash with a Postgres/Redis/Kafka
# you already run for other projects. Override in .env.
name: aeoi

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Phase 21 (ADR-033): what every Python app container shares
x-app-env: &app-env
  AEOI_ENV: development
  AEOI_PG_HOST: postgres
  AEOI_PG_PORT: "5432"
  AEOI_KAFKA_BOOTSTRAP_SERVERS: kafka:19092  # the INTERNAL listener (other containers)
  # token `iss` stays http://localhost:8090/realms/aeoi (Keycloak --hostname); only the KEYS
  # are fetched over the compose network
  AEOI_OIDC_ISSUER: ${AEOI_OIDC_ISSUER:-}
  AEOI_OIDC_JWKS_URL: ${AEOI_OIDC_ISSUER:+http://keycloak:8080/realms/aeoi/protocol/openid-connect/certs}
  AEOI_OIDC_CLIENTS: ${AEOI_OIDC_CLIENTS:-aeoi-console}
  # Phase 23a (ADR-035): a switch from .env (any value) -> the collector by its compose name;
  # unset -> no telemetry at all (the default)
  AEOI_OTEL_ENDPOINT: ${AEOI_OTEL_ENDPOINT:+http://otel-collector:4318}
  # Docker Desktop copies YOUR proxy settings into containers: calls between services carry user
  # tokens and must never go through a proxy (review #12)
  NO_PROXY: &no-proxy localhost,127.0.0.1,host.docker.internal,postgres,kafka,keycloak,otel-collector,api,incident-service,orchestrator,agents,rag,llm-gateway,tool-gateway,audit,service-catalog
  no_proxy: *no-proxy

x-app: &app
  <<: *defaults
  image: aeoi-py:${AEOI_IMAGE_TAG:-dev}
  profiles: ["apps"]
  init: true
  read_only: true  # code + venv are not writable; /tmp is a small tmpfs
  tmpfs: ["/tmp:size=64m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pull_policy: never  # built locally (make images); a missing image must not hit Docker Hub
  depends_on:
    postgres: { condition: service_healthy }
  deploy:
    resources:
      # MEASURED (Mac, 2026-10-14, make apps-peaks during multi-smoke + 4 smokes): Python peaks
      # 81-125 MiB -> 256M = 2x the highest. Re-measure with a high one so the limit does not
      # cut the peak: AEOI_APP_MEM_LIMIT=2g make apps-up, then make apps-peaks (ADR-033)
      limits: { memory: "${AEOI_APP_MEM_LIMIT:-256M}", cpus: "1.0" }

services:
  postgres:
    <<: *defaults
    image: pgvector/pgvector:pg16
    profiles: ["infra", "kafka", "core", "agents", "full", "apps", "apps-catalog"]
    environment:
      POSTGRES_USER: aeoi
      POSTGRES_DB: aeoi
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500   # log queries slower than 500 ms
    ports: ["127.0.0.1:${AEOI_PG_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeoi -d aeoi && psql -U aeoi -d aeoi -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        # measured 542 MiB after start, 652 MiB an hour later (heap capped at 512m)
        limits: { memory: 1G, cpus: "1.5" }

  redis:
    <<: *defaults
    image: redis:7.4-alpine
    # Phase 28 (owner, 2026-10-26): NO service uses Redis until replicas exist (ADR-031, 22b
    # deferred) - it only cost Docker memory. Start it on purpose: make up PROFILE=redis
    profiles: ["redis"]
    # Cache / rate limits / locks only - NOT a source of truth, so no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${AEOI_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.5" }

  kafka:
    <<: *defaults
    image: apache/kafka:3.9.1
    profiles: ["kafka", "agents", "full"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL = other containers (kafka:19092); HOST = your Mac (localhost:9094)
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${AEOI_KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    ports: ["127.0.0.1:${AEOI_KAFKA_PORT:-9094}:9092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # this probe starts a SECOND JVM: every 10 s it caused CPU spikes to the 1.5-core cap
      # (measured on the Mac, 2026-10-14: median ~2 %, peaks 160-178 %, our services on or
      # off). Now: every 2 s while starting (healthy as soon as it is), then every 60 s.
      # and the probe JVM INHERITED the broker's 512m heap (KAFKA_HEAP_OPTS): give it its own,
      # small one, and a fast-start JIT (review #5)
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m KAFKA_JVM_PERFORMANCE_OPTS='-XX:TieredStopAtLevel=1 -XX:+UseSerialGC' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
      start_interval: 2s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.5" }

  kafka-init:
    # One-shot job, run by `make up PROFILE=kafka` / `make kafka-init` (never auto-started).
    image: apache/kafka:3.9.1
    profiles: ["tools"]
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:19092
    volumes:
      - ./infrastructure/docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    deploy:
      resources:
        limits: { memory: 384M }

  keycloak:
    # Phase 17 (ADR-027): the OIDC identity provider every service trusts for USER tokens.
    # The realm is GENERATED from identity.users (`make keycloak-realm`) and re-imported on
    # every `make keycloak-up` (dev H2 store, no volume: the directory stays the source).
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["auth", "full"]
    # the image cannot read a password from a file: read the Docker secret, then exec kc.sh
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev --http-port=8080 --import-realm
        --health-enabled=true --hostname=http://localhost:${AEOI_KC_PORT:-8090}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    secrets: [keycloak_admin_password]
    ports: ["127.0.0.1:${AEOI_KC_PORT:-8090}:8080"]
    volumes:
      - ./secrets/keycloak/aeoi-realm.json:/opt/keycloak/data/import/aeoi-realm.json:ro
    healthcheck:
      # no curl in the image: bash /dev/tcp against the management port (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # measured on the owner's Intel Mac: ~4 min to healthy (start-dev rebuilds Quarkus on
      # every fresh container ~100 s, schema ~20 s, realm import ~40 s); failures before 300 s
      # do not count
      start_period: 300s
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.5" }

  # ---------------------------------------------------------------- apps (Phase 21, ADR-033)
  # ONE image (aeoi-py) for every Python service; each picks its command. Addresses are compose
  # DNS names, never localhost (tests/unit/test_compose_contract.py checks every *_url setting).
  # Each container gets ONLY the secret files its settings read (least privilege), read-only.
  # Ports bind to 127.0.0.1, the same ports as `make run-*`: the smokes run unchanged.
  # Memory (MEASURED, ADR-033): 8 x 256M + catalog 512M = 2.5 GiB of the ~4.8 GiB left after the
  # infra limits. Peaks: Python 81-125 MiB, catalog 173 MiB (JVM: heap 256m + non-heap).
  # Healthchecks: the image's own HEALTHCHECK (readiness on AEOI_SERVICE_PORT).
  api:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_api.main:build_app", "--host", "0.0.0.0",
              "--port", "8000", "--log-level", "warning"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8000"
      AEOI_API_INCIDENT_SERVICE_URL: http://incident-service:8001
      AEOI_API_RAG_SERVICE_URL: http://rag:8004
      AEOI_API_TOOL_GATEWAY_URL: http://tool-gateway:8006
      AEOI_API_ORCHESTRATOR_URL: http://orchestrator:8002
      AEOI_API_AUDIT_SERVICE_URL: http://audit:8008
      # Phase 27: per-user limit; the CAPACITY load run raises it at deploy time only
      # (API_RATE_LIMIT_PER_MINUTE=... make k8s-apply) and records the value it ran with
      AEOI_API_RATE_LIMIT_PER_MINUTE: "${API_RATE_LIMIT_PER_MINUTE:-120}"
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: api_svc_password, target: /app/secrets/api_svc_password.txt }
      - { source: delegation_private, target: /app/secrets/delegation_private.pem }

  incident-service:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_incident.main:build_app", "--host", "0.0.0.0",
              "--port", "8001", "--log-level", "warning"]
    ports: ["127.0.0.1:8001:8001"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8001"
      # Phase 18a switch, read from .env exactly like a host run (log | kafka)
      AEOI_INCIDENT_EVENT_TRANSPORT: ${AEOI_INCIDENT_EVENT_TRANSPORT:-log}
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: incident_svc_password, target: /app/secrets/incident_svc_password.txt }
      - { source: delegation_public, target: /app/secrets/delegation_public.pem }

  orchestrator:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_orchestrator.main:build_app", "--host", "0.0.0.0",
              "--port", "8002", "--log-level", "warning"]
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      # it resumes RUNNING investigations at start: everything a resumed node calls must be READY
      agents: { condition: service_healthy }
      api: { condition: service_healthy }  # token exchange (ADR-019)
      incident-service: { condition: service_healthy }
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8002"
      AEOI_ORCH_INCIDENT_SERVICE_URL: http://incident-service:8001
      AEOI_ORCH_AGENTS_URL: http://agents:8003
      AEOI_ORCH_API_URL: http://api:8000
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: orch_svc_password, target: /app/secrets/orch_svc_password.txt }
      - { source: orchestrator_service_token, target: /app/secrets/orchestrator_service_token.txt }

  agents:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_agents.main:build_app", "--host", "0.0.0.0",
              "--port", "8003", "--log-level", "warning"]
    ports: ["127.0.0.1:8003:8003"]
    depends_on: {}  # no database of its own
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8003"
      AEOI_AGENTS_TOOL_GATEWAY_URL: http://tool-gateway:8006
      AEOI_AGENTS_LLM_GATEWAY_URL: http://llm-gateway:8005
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: delegation_public, target: /app/secrets/delegation_public.pem }
      - { source: agents_service_token, target: /app/secrets/agents_service_token.txt }
      - { source: action_executor_token, target: /app/secrets/action_executor_token.txt }

  rag:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_rag.main:build_app", "--host", "0.0.0.0",
              "--port", "8004", "--log-level", "warning"]
    ports: ["127.0.0.1:8004:8004"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8004"
      AEOI_RAG_LLM_GATEWAY_URL: http://llm-gateway:8005
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: rag_svc_password, target: /app/secrets/rag_svc_password.txt }
      - { source: delegation_public, target: /app/secrets/delegation_public.pem }
      - { source: rag_service_token, target: /app/secrets/rag_service_token.txt }

  llm-gateway:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_llm.main:build_app", "--host", "0.0.0.0",
              "--port", "8005", "--log-level", "warning"]
    ports: ["127.0.0.1:8005:8005"]
    # Ollama runs NATIVE on the Mac (architecture.md §21); on Linux this name needs the gateway
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8005"
      AEOI_LLM_ROUTING_FILE: services/llm-gateway/config/${LLM_ROUTING:-routing.yaml}
      # still a LOCAL provider (hosted: false): only a loopback/host-gateway name is accepted
      AEOI_LLM_PROVIDER_OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: llm_svc_password, target: /app/secrets/llm_svc_password.txt }
      # a FILE, never an env var: container env is visible in `docker inspect`
      - { source: anthropic_api_key, target: /app/secrets/anthropic_api_key.txt }

  tool-gateway:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_tools.main:build_app", "--host", "0.0.0.0",
              "--port", "8006", "--log-level", "warning"]
    ports: ["127.0.0.1:8006:8006"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8006"
      AEOI_TOOLS_RAG_URL: http://rag:8004
      AEOI_TOOLS_INCIDENT_SERVICE_URL: http://incident-service:8001
      AEOI_TOOLS_AUDIT_URL: http://audit:8008
      # Phase 20 switch from .env: set -> the Java catalog by its compose name; unset -> JSON
      AEOI_TOOLS_CATALOG_URL: ${AEOI_TOOLS_CATALOG_URL:+http://service-catalog:8010}
      # EXACTLY the hosts of the HTTP-backed tools above, nothing else (the contract test checks
      # both directions: a missing host breaks a tool, an extra one widens egress)
      AEOI_TOOLS_EGRESS_ALLOWLIST: '["rag:8004", "service-catalog:8010"]'
    volumes:
      # catalog.json (the default catalog source). Long form: a missing folder is an ERROR, not
      # a silently created empty one (the catalog loads lazily: healthy, then the tool fails)
      - type: bind
        source: ./data/generated
        target: /app/data/generated
        read_only: true
        bind: { create_host_path: false }
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: tools_svc_password, target: /app/secrets/tools_svc_password.txt }
      - { source: delegation_public, target: /app/secrets/delegation_public.pem }
      - { source: tools_catalog_token, target: /app/secrets/tools_catalog_token.txt }
      - { source: tools_rag_token, target: /app/secrets/tools_rag_token.txt }
      - { source: tools_incident_token, target: /app/secrets/tools_incident_token.txt }
      - { source: cd_svc_password, target: /app/secrets/cd_svc_password.txt }
      - { source: tools_audit_token, target: /app/secrets/tools_audit_token.txt }

  audit:
    <<: *app
    command: ["uvicorn", "--factory", "aeoi_audit.main:build_app", "--host", "0.0.0.0",
              "--port", "8008", "--log-level", "warning"]
    ports: ["127.0.0.1:8008:8008"]
    environment:
      <<: *app-env
      AEOI_SERVICE_PORT: "8008"
      AEOI_AUDIT_CONSUMER_ENABLED: ${AEOI_AUDIT_CONSUMER_ENABLED:-false}
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: audit_svc_password, target: /app/secrets/audit_svc_password.txt }

  service-catalog:
    # Phase 20 (ADR-032) in a container: only with the Java switch on (make apps-up adds the
    # profile when AEOI_TOOLS_CATALOG_URL is set). Flyway stays OFF: `make catalog-import`.
    <<: *defaults
    image: aeoi-catalog:${AEOI_IMAGE_TAG:-dev}
    pull_policy: never
    profiles: ["apps-catalog"]
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8010:8010"]
    environment:
      AEOI_PG_HOST: postgres
      AEOI_PG_PORT: "5432"
      # the image's entrypoint reads the FILE into the process env only (never the container's)
      CATALOG_DB_PASSWORD_FILE: /app/secrets/catalog_svc_password.txt
      # Phase 23a: the image's entrypoint adds the OTel Java agent only when this is set
      AEOI_OTEL_ENDPOINT: ${AEOI_OTEL_ENDPOINT:+http://otel-collector:4318}
    secrets:
      - { source: jwt_public, target: /app/secrets/jwt_public.pem }
      - { source: catalog_svc_password, target: /app/secrets/catalog_svc_password.txt }
    deploy:
      resources:
        # 2 CPUs: on 1 the JVM needed 39-47 s to start (Mac, Phase 21); 12 cores are there
        limits: { memory: "${AEOI_APP_MEM_LIMIT:-512M}", cpus: "2.0" }

  # ---------------------------------------------------------------- observability (Phase 23a, ADR-035)
  # The collector and the backends stay in compose (like postgres/kafka: the stand-in for
  # managed backends). Kind pods reach otel-collector:4318 through aeoi_default, compose apps
  # directly. Measured idle on the Mac (2026-10-17): ~263 MiB together; the limits below are
  # PROVISIONAL until `make obs-peaks` during the smokes (the Phase 21 method).
  otel-collector:
    <<: *defaults
    image: otel/opentelemetry-collector-contrib:0.154.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["127.0.0.1:4318:4318"]  # host-run services (make run-*) export here
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }  # memory_limiter in the config: 200 MiB

  tempo-init:
    # one-shot: the named volume starts owned by root; tempo runs as 10001 (Tempo's own examples).
    # NOT the tempo image: it has no chown (Mac, 2026-10-17: "exec: chown: not found").
    # redis:7.4-alpine is already pulled for redis and has busybox chown - no new image.
    image: redis:7.4-alpine
    profiles: ["observability"]
    restart: "no"
    user: "0"
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes: ["tempodata:/var/tempo"]
    network_mode: none

  tempo:
    <<: *defaults
    image: grafana/tempo:2.10.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:3200:3200"]  # the query API (make obs-smoke, Grafana uses tempo:3200)
    depends_on:
      tempo-init: { condition: service_completed_successfully }
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver   # the collector pushes OTLP; nothing is scraped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }

  loki:
    <<: *defaults
    image: grafana/loki:3.6.12
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:3100:3100"]  # the query API (make obs-smoke)
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { memory: 384M, cpus: "1.0" }

  grafana:
    <<: *defaults
    image: grafana/grafana:12.3.9
    profiles: ["observability"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # nothing phones home; no plugin downloads at start
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console  # the default also writes /var/log/grafana: read-only here
    secrets: [grafana_admin_password, grafana_ro_password]
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafanadata:/var/lib/grafana
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

secrets:
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  # Phase 21 apps: one entry per FILE, so each container can be given only what it reads
  jwt_public:
    file: ./secrets/jwt_public.pem
  delegation_public:
    file: ./secrets/delegation_public.pem
  delegation_private:
    file: ./secrets/delegation_private.pem
  api_svc_password:
    file: ./secrets/api_svc_password.txt
  incident_svc_password:
    file: ./secrets/incident_svc_password.txt
  orch_svc_password:
    file: ./secrets/orch_svc_password.txt
  rag_svc_password:
    file: ./secrets/rag_svc_password.txt
  llm_svc_password:
    file: ./secrets/llm_svc_password.txt
  tools_svc_password:
    file: ./secrets/tools_svc_password.txt
  audit_svc_password:
    file: ./secrets/audit_svc_password.txt
  cd_svc_password:
    file: ./secrets/cd_svc_password.txt
  catalog_svc_password:
    file: ./secrets/catalog_svc_password.txt
  orchestrator_service_token:
    file: ./secrets/orchestrator_service_token.txt
  agents_service_token:
    file: ./secrets/agents_service_token.txt
  action_executor_token:
    file: ./secrets/action_executor_token.txt
  rag_service_token:
    file: ./secrets/rag_service_token.txt
  tools_catalog_token:
    file: ./secrets/tools_catalog_token.txt
  tools_rag_token:
    file: ./secrets/tools_rag_token.txt
  tools_incident_token:
    file: ./secrets/tools_incident_token.txt
  tools_audit_token:
    file: ./secrets/tools_audit_token.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  # Phase 23a: Grafana's admin login (make obs-up creates it) and its read-only DB login
  # (make db-users: grafana_ro -> role obs_reader, a few named columns only)
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  grafana_ro_password:
    file: ./secrets/grafana_ro_password.txt

volumes:
  pgdata:
  kafkadata:
  tempodata:
  promdata:
  lokidata:
  grafanadata:
