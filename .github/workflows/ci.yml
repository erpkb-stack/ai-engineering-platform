# Phase 2 CI: proves the repo builds and the local infra starts on a clean Linux machine.
# Phase 24 (ADR-036): every PR also runs the Java tests, the console checks, and builds + scans
# both images. No push, no deploy, no environments (owner decision 2026-10-21).
# Rule: merge only when every check here is green (CI was red 2026-10-08..10-21 unnoticed).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: make lint
      - run: make typecheck
      - run: uv run pytest --cov --cov-report=term-missing

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra-smoke:
    name: compose infra + database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local-only config (same as `make setup`, without Python)
        run: |
          cp .env.example .env
          mkdir -p secrets && chmod 700 secrets
          openssl rand -hex 24 > secrets/postgres_password.txt
          chmod 644 secrets/postgres_password.txt
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: make up PROFILE=kafka
      - run: make verify-infra
      - name: Migrations, drift check, seed
        run: |
          make db-upgrade
          make db-check
          make db-seed
          make db-verify
      - name: Integration tests (DB + Kafka publisher)
        run: make test-integration
        env:
          AEOI_TEST_KAFKA: "1"
      - name: LLM gateway smoke (real process + DB, FAKE providers - no key, no cost)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt_private.pem
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
          make delegation-keys   # Phase 9 (ADR-019): the api's token exchange needs it AT START
          make db-users
          AEOI_LLM_ROUTING_FILE=services/llm-gateway/config/routing.test.yaml AEOI_LLM_LOG_JSON=false \
            uv run uvicorn --factory aeoi_llm.main:build_app --port 8005 > llm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8005/health/live > /dev/null && break; sleep 1; done
          LLM_SMOKE_ROUTE=reasoning ./scripts/smoke-phase5.sh || { cat llm.log; exit 1; }
      - name: RAG ingest + eval gate (fake embeddings - leakage and quarantine must be 0)
        run: |
          make rag-token
          make rag-ingest
          make rag-eval   # exits 1 on any leakage or quarantine violation
          make rag-stats
      - name: Tool gateway smoke (real processes + DB; rag not started -> knowledge tool is a note)
        run: |
          make tools-tokens
          uv run uvicorn --factory aeoi_audit.main:build_app --port 8008 > audit.log 2>&1 &
          uv run uvicorn --factory aeoi_tools.main:build_app --port 8006 > tools.log 2>&1 &
          uv run uvicorn --factory aeoi_incident.main:build_app --port 8001 > incident.log 2>&1 &
          uv run uvicorn --factory aeoi_api.main:build_app --port 8000 > api.log 2>&1 &
          for p in 8008 8006 8001 8000; do
            for i in $(seq 1 30); do curl -sf localhost:$p/health/live > /dev/null && break; sleep 1; done
          done
          ./scripts/smoke-phase7.sh || { tail -n 80 tools.log audit.log api.log; exit 1; }
      - name: Log Analysis agent smoke (agents + orchestrator; FAKE model)
        # Phase 9 moved `agent-run` behind the orchestrator; CI never started it - red from
        # 2026-10-08 (PR #8) to 2026-10-21 (Phase 24 found and fixed it).
        run: |
          make agents-tokens
          uv run uvicorn --factory aeoi_agents.main:build_app --port 8003 > agents.log 2>&1 &
          uv run uvicorn --factory aeoi_orchestrator.main:build_app --port 8002 > orch.log 2>&1 &
          for p in 8003 8002; do
            for i in $(seq 1 30); do curl -sf localhost:$p/health/live > /dev/null && break; sleep 1; done
          done
          ./scripts/smoke-phase8.sh || { tail -n 80 orch.log agents.log tools.log incident.log; exit 1; }
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile infra --profile kafka --profile tools logs --tail=200
      - name: Tear down
        if: always()
        run: make clean CONFIRM=1

  catalog:
    name: java catalog · mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local-only config (same as `make setup`, without Python)
        run: |
          cp .env.example .env
          mkdir -p secrets && chmod 700 secrets
          openssl rand -hex 24 > secrets/postgres_password.txt
          chmod 644 secrets/postgres_password.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make up PROFILE=infra   # the tests use the compose Postgres (own random database)
      - run: make catalog-build
      - name: Count the Java tests (mvn -q hides them; 0 tests must not look green)
        run: |
          python3 - services/service-catalog/target/surefire-reports <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          n = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in pathlib.Path(sys.argv[1]).glob("TEST-*.xml"):
              suite = ET.parse(f).getroot()
              for k in n:
                  n[k] += int(suite.get(k, 0))
          print(f"java tests: {n}")
          sys.exit(0 if n["tests"] > 0 and n["skipped"] == 0 else 1)
          PY
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile infra logs --tail=200
      - name: Tear down
        if: always()
        run: make clean CONFIRM=1

  frontend:
    name: console · typecheck · tests · api types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make ui-install
      - run: make ui-check

  images:
    name: images · build · trivy scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Trivy itself was compromised in March 2026 (v0.69.4, most trivy-action tags, Docker Hub
      # 0.69.5/0.69.6). So: no action, no image - the v0.69.3 release binary, pinned by SHA-256.
      # The hash was checked against its Sigstore bundle (signed 2026-03-03 by trivy's own
      # release workflow at tag v0.69.3). Changing the version = a new reviewed hash (ADR-036).
      TRIVY_VERSION: "0.69.3"
      TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
    steps:
      - uses: actions/checkout@v7
      - run: make images IMAGE_TAG=ci
      - name: Install Trivy (pinned binary, hash verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          ./trivy --version
      - name: Scan both images (HIGH + CRITICAL; report only until the baseline is reviewed)
        run: |
          {
            echo "| image | CRITICAL | HIGH | fixable |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for img in aeoi-py:ci aeoi-catalog:ci; do
            "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
              --no-progress --format json -o "$RUNNER_TEMP/scan.json" "$img"
            "$RUNNER_TEMP/trivy" convert --format table "$RUNNER_TEMP/scan.json"
            jq -r --arg img "$img" '[.Results[]?.Vulnerabilities[]?] as $v
              | "| \($img) | \([$v[] | select(.Severity == "CRITICAL")] | length)"
              + " | \([$v[] | select(.Severity == "HIGH")] | length)"
              + " | \([$v[] | select(.FixedVersion // "" | length > 0)] | length) |"' \
              "$RUNNER_TEMP/scan.json" >> "$GITHUB_STEP_SUMMARY"
          done
