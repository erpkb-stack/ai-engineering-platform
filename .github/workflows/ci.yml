# Phase 2 CI: proves the repo builds and the local infra starts on a clean Linux machine.
# Phase 24 extends this to: integration tests, image build/scan/push, deploy, smoke tests.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: make lint
      - run: make typecheck
      - run: uv run pytest --cov --cov-report=term-missing

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra-smoke:
    name: compose infra + database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare local-only config (same as `make setup`, without Python)
        run: |
          cp .env.example .env
          mkdir -p secrets && chmod 700 secrets
          openssl rand -hex 24 > secrets/postgres_password.txt
          chmod 644 secrets/postgres_password.txt
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: make up PROFILE=kafka
      - run: make verify-infra
      - name: Migrations, drift check, seed
        run: |
          make db-upgrade
          make db-check
          make db-seed
          make db-verify
      - name: Integration tests (DB + Kafka publisher)
        run: make test-integration
        env:
          AEOI_TEST_KAFKA: "1"
      - name: LLM gateway smoke (real process + DB, FAKE providers - no key, no cost)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/jwt_private.pem
          openssl rsa -in secrets/jwt_private.pem -pubout -out secrets/jwt_public.pem
          make db-users
          AEOI_LLM_ROUTING_FILE=services/llm-gateway/config/routing.test.yaml AEOI_LLM_LOG_JSON=false \
            uv run uvicorn --factory aeoi_llm.main:build_app --port 8005 > llm.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8005/health/live > /dev/null && break; sleep 1; done
          LLM_SMOKE_ROUTE=reasoning ./scripts/smoke-phase5.sh || { cat llm.log; exit 1; }
      - name: RAG ingest + eval gate (fake embeddings - leakage and quarantine must be 0)
        run: |
          make rag-token
          make rag-ingest
          make rag-eval   # exits 1 on any leakage or quarantine violation
          make rag-stats
      - name: Tool gateway smoke (real processes + DB; rag not started -> knowledge tool is a note)
        run: |
          make tools-tokens
          uv run uvicorn --factory aeoi_audit.main:build_app --port 8008 > audit.log 2>&1 &
          uv run uvicorn --factory aeoi_tools.main:build_app --port 8006 > tools.log 2>&1 &
          uv run uvicorn --factory aeoi_incident.main:build_app --port 8001 > incident.log 2>&1 &
          uv run uvicorn --factory aeoi_api.main:build_app --port 8000 > api.log 2>&1 &
          for p in 8008 8006 8001 8000; do
            for i in $(seq 1 30); do curl -sf localhost:$p/health/live > /dev/null && break; sleep 1; done
          done
          ./scripts/smoke-phase7.sh || { tail -n 80 tools.log audit.log api.log; exit 1; }
      - name: Log Analysis agent smoke (agents + thin orchestrator runner; FAKE model)
        run: |
          make agents-tokens
          uv run uvicorn --factory aeoi_agents.main:build_app --port 8003 > agents.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8003/health/live > /dev/null && break; sleep 1; done
          ./scripts/smoke-phase8.sh || { tail -n 80 agents.log tools.log incident.log; exit 1; }
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile infra --profile kafka --profile tools logs --tail=200
      - name: Tear down
        if: always()
        run: make clean CONFIRM=1
