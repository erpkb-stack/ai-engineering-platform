# Claude Code GitHub Action: mention @claude in a PR/issue comment to get a review or a fix.
# Setup: in Claude Code run `/install-github-app`, or add repo secret ANTHROPIC_API_KEY manually.
# The full CI/CD pipeline (lint → type → tests → scan → build → push → deploy → smoke) is Phase 24.
name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1 on 2026-10-21
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude reads CLAUDE.md, .claude/rules, skills and agents from the repo automatically.
