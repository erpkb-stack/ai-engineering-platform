[project]
name = "aeoi-common"
version = "0.1.0"
description = "Shared config, errors, ids and correlation context for AEOI services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_common"]
