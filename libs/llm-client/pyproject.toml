[project]
name = "aeoi-llm-client"
version = "0.1.0"
description = "The ONLY way agents/services call an LLM: a thin client for services/llm-gateway"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_llm_client"]
