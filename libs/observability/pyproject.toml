[project]
name = "aeoi-observability"
version = "0.1.0"
description = "Structured JSON logging with correlation ids and redaction"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
    "aeoi-common",
    "aeoi-security",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_observability"]

[tool.uv.sources]
aeoi-common = { workspace = true }
aeoi-security = { workspace = true }
