[project]
name = "aeoi-security"
version = "0.1.0"
description = "Untrusted-data wrapping and secret redaction helpers"
requires-python = ">=3.12"
dependencies = [
    "aeoi-common",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_security"]

[tool.uv.sources]
aeoi-common = { workspace = true }
