[project]
name = "aeoi-codeparse"
version = "0.1.0"
description = "Phase 14 (ADR-024): tree-sitter parsing of java/python/go - definitions, references and diff rules (shared by rag and agents)"
requires-python = ">=3.12"
# tree-sitter 0.23.0 is the last release with Intel-Mac (macosx x86_64) wheels; the grammars are
# pinned to the 0.23 line because newer grammars use a language ABI 0.23.0 cannot load
dependencies = [
    "tree-sitter==0.23.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.23.6",
    "tree-sitter-go==0.23.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_codeparse"]
