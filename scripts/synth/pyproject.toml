[project]
name = "aeoi-synth"
version = "0.1.0"
description = "Deterministic fictional enterprise data (Northwind Cloud Systems) for AEOI demos, tests and evals"
requires-python = ">=3.12"
dependencies = [
    "aeoi-db",
    "aeoi-common",
]

[project.scripts]
aeoi-synth = "aeoi_synth.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeoi_synth"]

[tool.uv.sources]
aeoi-db = { workspace = true }
aeoi-common = { workspace = true }
