# AEOI uv workspace root (virtual: no [project] table).
# Members: shared libs now; services join in the phase that creates them.
[tool.uv.workspace]
members = [
    "libs/*", "scripts/synth", "services/api", "services/incident-service", "services/llm-gateway",
    "services/rag", "services/tool-gateway", "services/audit",
]

[tool.uv]
required-version = ">=0.5"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "pre-commit>=4.0",
]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_to_delete", "data/generated", "data/sample-documents"]
force-exclude = true  # also when pre-commit passes file names explicitly

[tool.ruff.lint.isort]
known-first-party = [
    "aeoi_common", "aeoi_models", "aeoi_security", "aeoi_observability", "aeoi_db", "aeoi_synth",
    "aeoi_web", "aeoi_api", "aeoi_incident", "aeoi_llm", "aeoi_llm_client", "aeoi_rag", "aeoi_tools",
    "aeoi_audit", "tests",
]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "S",             # bandit (security)
    "ASYNC",         # blocking calls in async code
    "RUF",
    "PT",            # pytest style
    "N",             # naming
]
ignore = [
    "RUF012",
    "E501",  # the formatter owns line length; it leaves long strings/SQL alone on purpose
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S608", "PT018"]
"tests/**" = ["S101", "S105", "S106", "S608", "PT018"]
"**/alembic/versions/*.py" = ["E501", "RUF001", "S608"]  # DDL built from constants
"scripts/synth/**" = ["S311"]  # random is fine for synthetic data

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = [
    "libs/common/src", "libs/models/src", "libs/security/src", "libs/observability/src",
    "libs/db/src", "libs/web/src", "scripts/synth/src", "services/api/src",
    "services/incident-service/src", "services/llm-gateway/src", "libs/llm-client/src",
    "services/rag/src",
]
packages = [
    "aeoi_common", "aeoi_models", "aeoi_security", "aeoi_observability", "aeoi_db", "aeoi_synth",
    "aeoi_web", "aeoi_api", "aeoi_incident", "aeoi_llm", "aeoi_llm_client", "aeoi_rag",
    "aeoi_tools", "aeoi_audit",
]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = [
    "tests", "libs", "scripts/synth", "services/api", "services/incident-service",
    "services/llm-gateway", "services/rag", "services/tool-gateway", "services/audit",
]
addopts = "--import-mode=importlib -ra --strict-markers --strict-config -m 'not integration and not eval and not e2e'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no IO (default)",
    "integration: needs Docker infra (make up)",
    "eval: calls real LLMs, costs money",
    "e2e: full stack",
    "kafka: needs a running Kafka broker (AEOI_TEST_KAFKA=1)",
]

[tool.coverage.run]
branch = true
source = ["libs"]
