# Phase 24b (ADR-036): CRITICAL findings that HAVE a fix somewhere, but not one we can take now.
# scripts/scan_gate.py fails CI on: a fixable CRITICAL not listed here; an expired entry; an
# entry longer than 120 days; an entry that matches nothing (stale). Each entry = a dated promise.

[[exception]]
