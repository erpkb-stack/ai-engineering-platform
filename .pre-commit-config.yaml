# Runs on `git commit` (installed by `make setup`). Run on everything: make hooks
# Update pinned versions: uv run pre-commit autoupdate
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files      # would have caught the Phase 1 tarball
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]   # k8s manifests later
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$  # tsconfig allows comments
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^data/sample-documents/   # generated corpus: must stay byte-identical
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: ^data/sample-documents/
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch
        args: ["--branch", "main"]       # work on branches; merge via PR

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, libs)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: (^|/)pyproject\.toml$|^uv\.lock$
        pass_filenames: false
